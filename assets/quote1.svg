<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <!-- Seamless Thinking Shape Mask -->
    <mask id="thoughtMask1">
      <rect width="850" height="220" fill="#000000"/>
      <!-- Main Cloud Capsule Body -->
      <rect x="100" y="25" width="650" height="130" rx="65" fill="#ffffff"/>
      <!-- Top Puffy Cloud Lobes -->
      <circle cx="210" cy="30" r="48" fill="#ffffff"/>
      <circle cx="340" cy="20" r="54" fill="#ffffff"/>
      <circle cx="480" cy="20" r="54" fill="#ffffff"/>
      <circle cx="620" cy="30" r="48" fill="#ffffff"/>
      <!-- Bottom Puffy Cloud Lobes -->
      <circle cx="230" cy="150" r="46" fill="#ffffff"/>
      <circle cx="360" cy="155" r="52" fill="#ffffff"/>
      <circle cx="500" cy="155" r="52" fill="#ffffff"/>
      <circle cx="640" cy="150" r="46" fill="#ffffff"/>
      <!-- Side Lobes -->
      <circle cx="105" cy="90" r="62" fill="#ffffff"/>
      <circle cx="745" cy="90" r="62" fill="#ffffff"/>
      <!-- Thinking Bubbles Trail (Bottom Left) -->
      <circle cx="250" cy="182" r="16" fill="#ffffff"/>
      <circle cx="218" cy="198" r="11" fill="#ffffff"/>
      <circle cx="192" cy="208" r="6.5" fill="#ffffff"/>
    </mask>
  </defs>

  <!-- Borderless Slightly Transparent Obsidian Fill (0.75 opacity) -->
  <rect width="850" height="220" fill="#080a11" fill-opacity="0.75" mask="url(#thoughtMask1)"/>

  <!-- Centered Quote Text Inside Thinking Bubble -->
  <g font-family="'Cinzel', 'Georgia', serif" text-anchor="middle">
    <text x="425" y="70" font-size="19" font-style="italic" fill="#f8fafc" letter-spacing="0.4">&#x201C;A true warrior knows that the greatest</text>
    <text x="425" y="100" font-size="19" font-style="italic" fill="#f8fafc" letter-spacing="0.4">enemy is the limit you set for yourself.&#x201D;</text>
  </g>
  <g font-family="'Inter', -apple-system, sans-serif" text-anchor="middle">
    <text x="425" y="138" font-size="13.5" font-weight="600" fill="#ffd700" letter-spacing="2">&#x2014; YodhaRaja, Level 99</text>
  </g>
</svg>
