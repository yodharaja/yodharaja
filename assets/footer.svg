<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%">
  <defs>
    <!-- Background Slice Gradients matching 0:050505, 50:292524, 100:ca8a04 -->
    <linearGradient id="sliceBaseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="45%" stop-color="#181513"/>
      <stop offset="70%" stop-color="#292524"/>
      <stop offset="90%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Secondary Slice Shard Gradient -->
    <linearGradient id="shardGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ca8a04" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#292524" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>

    <!-- Slice Blade Edge Glow -->
    <linearGradient id="edgeGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ca8a04" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffd700" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Volumetric Radial Glow Behind Canvas -->
    <radialGradient id="titleAura" cx="50%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#ca8a04" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#292524" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <!-- Shimmer Glint Beam Gradient -->
    <linearGradient id="shimmerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fffbeb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>

    <!-- Star Particle Pattern for Twinkling Animation -->
    <pattern id="twinkleStars" width="120" height="90" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#fff" opacity="0.6"/>
      <circle cx="75" cy="25" r="1.4" fill="#ffd700" opacity="0.8"/>
      <circle cx="45" cy="65" r="0.9" fill="#fef08a" opacity="0.5"/>
      <circle cx="105" cy="70" r="1.2" fill="#fff" opacity="0.7"/>
    </pattern>

    <!-- Dual Gaussian Blur Filter for Gold Aura -->
    <filter id="goldAuraFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Path for the Inverted Slice Footer Shape -->
    <clipPath id="footerSliceClip">
      <path d="M0,60 L1000,0 L1000,120 L0,120 Z"/>
    </clipPath>
  </defs>

  <style>
    /* Keyframe Animations Matching Header Slice Masterpiece */
    @keyframes starTwinkleA {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 0.95; transform: scale(1.15); }
    }

    @keyframes starTwinkleB {
      0%, 100% { opacity: 0.85; transform: scale(1.1); }
      50% { opacity: 0.15; transform: scale(0.85); }
    }

    @keyframes auraBreathing {
      0%, 100% { opacity: 0.55; transform: scale(0.97); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    @keyframes bladeLaserSweep {
      0% { transform: translateX(-400px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1100px); opacity: 0; }
    }

    @keyframes glintSpin {
      0% { transform: rotate(0deg) scale(0.8); opacity: 0.4; }
      50% { transform: rotate(180deg) scale(1.2); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.8); opacity: 0.4; }
    }

    .twinkle-layer-1 {
      animation: starTwinkleA 3.2s ease-in-out infinite;
    }
    .twinkle-layer-2 {
      animation: starTwinkleB 4.2s ease-in-out infinite;
    }
    .aura-layer {
      animation: auraBreathing 4.5s ease-in-out infinite;
      transform-origin: 500px 85px;
    }
    .blade-glint {
      animation: bladeLaserSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .sparkle-cross {
      animation: glintSpin 3s linear infinite;
      transform-origin: center;
    }
  </style>

  <!-- ================= BACKGROUND SLICE CANVAS ================= -->
  <!-- Inverted Diagonal Slice Footer (0,60 -> 1000,0 -> 1000,120 -> 0,120) -->
  <g clip-path="url(#footerSliceClip)">
    <rect width="1000" height="120" fill="url(#sliceBaseGrad)"/>

    <!-- Dynamic Volumetric Radial Light Aura with Breathing Animation -->
    <rect width="1000" height="120" fill="url(#titleAura)" class="aura-layer"/>

    <!-- Dynamic Twinkling Stars Pattern Layer -->
    <rect width="1000" height="120" fill="url(#twinkleStars)" class="twinkle-layer-1"/>

    <!-- Individual Twinkling Star Clusters - Layer 1 -->
    <g class="twinkle-layer-1">
      <circle cx="120" cy="85" r="1.8" fill="#ffd700"/>
      <circle cx="280" cy="95" r="1.2" fill="#fff"/>
      <circle cx="410" cy="75" r="2.2" fill="#fff4b8"/>
      <circle cx="590" cy="80" r="1.6" fill="#ffd700"/>
      <circle cx="740" cy="95" r="2.4" fill="#fff"/>
      <circle cx="890" cy="78" r="1.5" fill="#ca8a04"/>
    </g>

    <!-- Individual Twinkling Star Clusters - Layer 2 -->
    <g class="twinkle-layer-2">
      <circle cx="180" cy="100" r="2.0" fill="#fff"/>
      <circle cx="340" cy="80" r="1.5" fill="#ffd700"/>
      <circle cx="520" cy="68" r="2.5" fill="#fff8d6"/>
      <circle cx="680" cy="98" r="1.4" fill="#ca8a04"/>
      <circle cx="820" cy="72" r="2.2" fill="#ffd700"/>
      <circle cx="940" cy="90" r="1.6" fill="#fff"/>
    </g>

    <!-- Starburst Sparkles with Continuous Rotation -->
    <g transform="translate(190, 85) scale(0.7)" class="sparkle-cross">
      <path d="M0,-12 L2,-2 L12,0 L2,2 L0,12 L-2,2 L-12,0 L-2,-2 Z" fill="#ffd700"/>
      <circle cx="0" cy="0" r="2" fill="#fff"/>
    </g>
    <g transform="translate(500, 82) scale(0.6)" class="sparkle-cross">
      <path d="M0,-12 L2,-2 L12,0 L2,2 L0,12 L-2,2 L-12,0 L-2,-2 Z" fill="#fff8d6"/>
      <circle cx="0" cy="0" r="2" fill="#fff"/>
    </g>
    <g transform="translate(810, 75) scale(0.85)" class="sparkle-cross">
      <path d="M0,-12 L2,-2 L12,0 L2,2 L0,12 L-2,2 L-12,0 L-2,-2 Z" fill="#fff4b8"/>
      <circle cx="0" cy="0" r="2.5" fill="#fff"/>
    </g>

    <!-- Modern Hex Tech Accents Soft Watermark -->
    <g stroke="#ca8a04" stroke-width="0.7" fill="none" opacity="0.18">
      <polygon points="60,70 75,62 90,70 90,87 75,95 60,87"/>
      <polygon points="90,87 105,79 120,87 120,104 105,112 90,104"/>
      <polygon points="880,65 895,57 910,65 910,82 895,90 880,82"/>
      <polygon points="910,82 925,74 940,82 940,99 925,107 910,99"/>
    </g>
  </g>

  <!-- ================= UPPER SLICE SHARDS & BEVELS ================= -->
  <!-- Shadow Under-Slice -->
  <path d="M0,58 L1000,-2 L1000,2 L0,62 Z" fill="#000000" opacity="0.7"/>

  <!-- Shard Secondary Cut Line (Modernized Cyber-Slice Facet) -->
  <path d="M0,57 L1000,-3 L1000,1 L0,61 Z" fill="url(#edgeGlowGrad)" opacity="0.9"/>
  <path d="M0,60 L1000,0" stroke="#ffd700" stroke-width="2" filter="url(#goldAuraFilter)"/>
  <path d="M0,60 L1000,0" stroke="#fff8d6" stroke-width="1.2"/>

  <!-- Floating Shard Accent at Top-Right -->
  <polygon points="760,20 990,5 1000,12 780,27" fill="url(#shardGrad)" opacity="0.75"/>
  <polygon points="760,20 990,5" stroke="#ffd700" stroke-width="0.8" opacity="0.8"/>

  <!-- Floating Shard Accent at Top-Left -->
  <polygon points="20,68 260,52 240,57 10,73" fill="url(#shardGrad)" opacity="0.6"/>

  <!-- Dynamic Animated Laser Glint Sweeping along the Top Diagonal Slice -->
  <g class="blade-glint">
    <ellipse cx="0" cy="60" rx="90" ry="4" fill="url(#shimmerBeam)" transform="rotate(-3.43, 0, 60)"/>
  </g>

  <!-- ================= BOTTOM BEVEL ACCENT ================= -->
  <line x1="0" y1="119" x2="1000" y2="119" stroke="url(#edgeGlowGrad)" stroke-width="1.5" opacity="0.5"/>
</svg>
