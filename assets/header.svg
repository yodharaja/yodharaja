<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <!-- Background Slice Gradients matching 0:050505, 50:292524, 100:ca8a04 -->
    <linearGradient id="sliceBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="45%" stop-color="#181513"/>
      <stop offset="70%" stop-color="#292524"/>
      <stop offset="90%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Secondary Slice Shard Gradient -->
    <linearGradient id="shardGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ca8a04" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#292524" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>

    <!-- Ultra-Lustrous Gold Gradient for Title -->
    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04">
        <animate attributeName="stop-color" values="#ca8a04;#ffd700;#fff4b8;#ffd700;#ca8a04" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#ffd700">
        <animate attributeName="stop-color" values="#ffd700;#fff4b8;#ffd700;#ca8a04;#ffd700" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#fff8d6">
        <animate attributeName="stop-color" values="#fff8d6;#ffd700;#ca8a04;#ffd700;#fff8d6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#ffd700">
        <animate attributeName="stop-color" values="#ffd700;#ca8a04;#ffd700;#fff4b8;#ffd700" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b45309">
        <animate attributeName="stop-color" values="#b45309;#ca8a04;#ffd700;#ca8a04;#b45309" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Slice Blade Edge Glow -->
    <linearGradient id="edgeGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ca8a04" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffd700" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Volumetric Radial Glow Behind Title -->
    <radialGradient id="titleAura" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#ca8a04" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#292524" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <!-- Shimmer Glint Gradient -->
    <linearGradient id="shimmerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fffbeb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>

    <!-- Star Particle Pattern for Twinkling Animation -->
    <pattern id="twinkleStars" width="120" height="90" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#fff" opacity="0.6"/>
      <circle cx="75" cy="25" r="1.4" fill="#ffd700" opacity="0.8"/>
      <circle cx="45" cy="65" r="0.9" fill="#fef08a" opacity="0.5"/>
      <circle cx="105" cy="70" r="1.2" fill="#fff" opacity="0.7"/>
    </pattern>

    <!-- Filters -->
    <filter id="goldAuraFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Clip Path for the Iconic Capsule Slice Header Shape -->
    <clipPath id="headerSliceClip">
      <path d="M0,0 L1000,0 L1000,140 L0,220 Z"/>
    </clipPath>
  </defs>

  <style>
    .title-text {
      font-family: 'Cinzel', 'Trajan Pro', 'Georgia', 'Segoe UI', serif;
      font-weight: 900;
      letter-spacing: 6px;
      fill: url(#textGoldGrad);
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.45)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.9));
    }

    .desc-text {
      font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #fef08a;
      filter: drop-shadow(0 0 8px rgba(202, 138, 4, 0.5)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
    }

    /* Keyframe Animations */
    @keyframes starTwinkleA {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 0.95; transform: scale(1.15); }
    }

    @keyframes starTwinkleB {
      0%, 100% { opacity: 0.85; transform: scale(1.1); }
      50% { opacity: 0.15; transform: scale(0.85); }
    }

    @keyframes auraBreathing {
      0%, 100% { opacity: 0.6; transform: scale(0.97); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    @keyframes bladeLaserSweep {
      0% { transform: translateX(-400px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1100px); opacity: 0; }
    }

    @keyframes glintSpin {
      0% { transform: rotate(0deg) scale(0.8); opacity: 0.4; }
      50% { transform: rotate(180deg) scale(1.2); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.8); opacity: 0.4; }
    }

    .twinkle-layer-1 {
      animation: starTwinkleA 3.2s ease-in-out infinite;
    }
    .twinkle-layer-2 {
      animation: starTwinkleB 4.2s ease-in-out infinite;
    }
    .aura-layer {
      animation: auraBreathing 4.5s ease-in-out infinite;
      transform-origin: 500px 95px;
    }
    .blade-glint {
      animation: bladeLaserSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .sparkle-cross {
      animation: glintSpin 3s linear infinite;
      transform-origin: center;
    }
  </style>

  <!-- ================= BACKGROUND SLICE CANVAS ================= -->
  <!-- Main Angled Slice Header (0,0 -> 1000,0 -> 1000,140 -> 0,220) -->
  <g clip-path="url(#headerSliceClip)">
    <rect width="1000" height="220" fill="url(#sliceBaseGrad)"/>
    
    <!-- Dynamic Volumetric Radial Light Aura -->
    <rect width="1000" height="220" fill="url(#titleAura)" class="aura-layer"/>

    <!-- Dynamic Twinkling Stars (Capsule-Render Twinkling Recreation & Upgrade) -->
    <rect width="1000" height="220" fill="url(#twinkleStars)" class="twinkle-layer-1"/>
    
    <!-- Individual Twinkling Star Clusters -->
    <g class="twinkle-layer-1">
      <circle cx="120" cy="40" r="1.8" fill="#ffd700"/>
      <circle cx="280" cy="70" r="1.2" fill="#fff"/>
      <circle cx="410" cy="25" r="2.2" fill="#fff4b8"/>
      <circle cx="590" cy="30" r="1.6" fill="#ffd700"/>
      <circle cx="740" cy="65" r="2.4" fill="#fff"/>
      <circle cx="890" cy="45" r="1.5" fill="#ca8a04"/>
    </g>

    <g class="twinkle-layer-2">
      <circle cx="180" cy="90" r="2.0" fill="#fff"/>
      <circle cx="340" cy="35" r="1.5" fill="#ffd700"/>
      <circle cx="520" cy="18" r="2.5" fill="#fff8d6"/>
      <circle cx="680" cy="85" r="1.4" fill="#ca8a04"/>
      <circle cx="820" cy="30" r="2.2" fill="#ffd700"/>
      <circle cx="940" cy="75" r="1.6" fill="#fff"/>
    </g>

    <!-- Starburst Sparkles -->
    <g transform="translate(190, 48) scale(0.7)" class="sparkle-cross">
      <path d="M0,-12 L2,-2 L12,0 L2,2 L0,12 L-2,2 L-12,0 L-2,-2 Z" fill="#ffd700"/>
      <circle cx="0" cy="0" r="2" fill="#fff"/>
    </g>
    <g transform="translate(810, 52) scale(0.85)" class="sparkle-cross">
      <path d="M0,-12 L2,-2 L12,0 L2,2 L0,12 L-2,2 L-12,0 L-2,-2 Z" fill="#fff4b8"/>
      <circle cx="0" cy="0" r="2.5" fill="#fff"/>
    </g>

    <!-- Modern Hex Tech Accents Soft Watermark -->
    <g stroke="#ca8a04" stroke-width="0.7" fill="none" opacity="0.18">
      <polygon points="60,30 75,22 90,30 90,47 75,55 60,47"/>
      <polygon points="90,47 105,39 120,47 120,64 105,72 90,64"/>
      <polygon points="880,40 895,32 910,40 910,57 895,65 880,57"/>
      <polygon points="910,57 925,49 940,57 940,74 925,82 910,74"/>
    </g>
  </g>

  <!-- ================= LOWER SLICE SHARDS & BEVELS ================= -->
  <!-- Shadow Under-Slice -->
  <path d="M0,220 L1000,140 L1000,145 L0,225 Z" fill="#000000" opacity="0.7"/>

  <!-- Shard Secondary Cut Line (Modernized Cyber-Slice Facet) -->
  <path d="M0,217 L1000,137 L1000,142 L0,222 Z" fill="url(#edgeGlowGrad)" opacity="0.9"/>
  <path d="M0,220 L1000,140" stroke="#ffd700" stroke-width="2" filter="url(#goldAuraFilter)"/>
  <path d="M0,220 L1000,140" stroke="#fff8d6" stroke-width="1.2"/>

  <!-- Secondary Floating Shard Accent at Bottom Right -->
  <polygon points="760,165 990,147 1000,154 780,172" fill="url(#shardGrad)" opacity="0.75"/>
  <polygon points="760,165 990,147" stroke="#ffd700" stroke-width="0.8" opacity="0.8"/>

  <!-- Secondary Floating Shard Accent at Bottom Left -->
  <polygon points="20,224 260,205 240,210 10,228" fill="url(#shardGrad)" opacity="0.6"/>

  <!-- Dynamic Animated Laser Glint Sweeping along the Diagonal Slice -->
  <g class="blade-glint">
    <ellipse cx="0" cy="220" rx="90" ry="4" fill="url(#shimmerBeam)" transform="rotate(-4.57, 0, 220)"/>
  </g>

  <!-- ================= TOP BEVEL ACCENT ================= -->
  <line x1="0" y1="1" x2="1000" y2="1" stroke="url(#edgeGlowGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- ================= CONTENT SECTION ================= -->
  <!-- Main Title: &#x2694;&#xFE0F; YODHARAJA &#x2694;&#xFE0F; (fontSize: 48, fontAlignY: 45%) -->
  <g transform="translate(500, 96)">
    <!-- Decorative Wings Left & Right -->
    <path d="M-260,-4 L-340,-4 L-355,-12 L-370,-4 L-420,-4" stroke="url(#edgeGlowGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="-355" cy="-12" r="2.5" fill="#ffd700"/>
    <polygon points="-260,-4 -250,-8 -250,0" fill="#ffd700"/>

    <path d="M260,-4 L340,-4 L355,-12 L370,-4 L420,-4" stroke="url(#edgeGlowGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="355" cy="-12" r="2.5" fill="#ffd700"/>
    <polygon points="260,-4 250,-8 250,0" fill="#ffd700"/>

    <!-- Exact Title Text -->
    <text text-anchor="middle" y="5" class="title-text" font-size="46">&#x2694;&#xFE0F; YODHARAJA &#x2694;&#xFE0F;</text>
  </g>

  <!-- Description / Subtitle: &#x2B50; Level 99 Engineer &#x2022; Legendary Class (descSize: 20, descAlignY: 65%) -->
  <g transform="translate(500, 142)">
    <!-- Sleek Glass Pill Frame Behind Desc -->
    <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#0d0e12" fill-opacity="0.75" stroke="#ca8a04" stroke-width="1" stroke-opacity="0.8" filter="url(#softShadow)"/>
    <rect x="-238" y="-12" width="476" height="24" rx="12" fill="none" stroke="#ffd700" stroke-width="0.5" stroke-opacity="0.5"/>

    <!-- Exact Desc Text -->
    <text text-anchor="middle" y="5" class="desc-text" font-size="16">&#x2B50; Level 99 Engineer &#x2022; Legendary Class</text>
  </g>
</svg>
