<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <!-- Semi-transparent Terminal Shell -->
  <rect x="2" y="2" width="796" height="156" rx="10" fill="#0b0f19" fill-opacity="0.82" stroke="#1e293b" stroke-width="1.2"/>
  
  <!-- Terminal Header Bar -->
  <rect x="2" y="2" width="796" height="28" rx="10" fill="#060910" fill-opacity="0.9"/>
  <!-- macOS Window Control Dots -->
  <circle cx="20" cy="16" r="4.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="34" cy="16" r="4.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="48" cy="16" r="4.5" fill="#10b981" opacity="0.8"/>
  <text x="400" y="20" font-family="'Fira Code', monospace" font-size="11" fill="#64748b" text-anchor="middle">warrior_creed.sh</text>

  <!-- Code Quote Content -->
  <g font-family="'Fira Code', monospace" text-anchor="middle">
    <text x="400" y="68" font-size="16.5" fill="#e2e8f0">&#x201C;A true warrior knows that the greatest</text>
    <text x="400" y="96" font-size="16.5" fill="#e2e8f0">enemy is the limit you set for yourself.&#x201D;</text>
    <text x="400" y="134" font-size="13" font-weight="600" fill="#ffd700" letter-spacing="1">&#x2014; YodhaRaja, Level 99</text>
  </g>
</svg>
